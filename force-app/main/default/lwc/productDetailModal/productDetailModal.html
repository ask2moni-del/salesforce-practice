<template>
    <template if:true={isOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Product Full Details (Child Modal)</h2>
                </header>
                
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-form">
                        <lightning-input label="Product Title" value={editableProduct.title} data-field="title" onchange={handleFieldChange} class="slds-m-bottom_small"></lightning-input>
                        
                        <lightning-input type="number" step="0.01" label="Price ($)" value={editableProduct.price} data-field="price" onchange={handleFieldChange} class="slds-m-bottom_small"></lightning-input>
                        
                        <lightning-input label="Category" value={editableProduct.category} data-field="category" onchange={handleFieldChange} class="slds-m-bottom_small"></lightning-input>
                        
                        <lightning-input label="Image URL" value={editableProduct.image} data-field="image" onchange={handleFieldChange} class="slds-m-bottom_small"></lightning-input>
                        
                        <lightning-textarea label="Description" value={editableProduct.description} data-field="description" onchange={handleFieldChange} class="slds-m-bottom_small"></lightning-textarea>
                    </div>
                </div>
                
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleClose}>Close</button>
                    <button class="slds-button slds-button_brand" onclick={handleSave}>Save Changes</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
