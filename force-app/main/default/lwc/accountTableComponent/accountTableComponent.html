<template>
    <lightning-card title="Account Inline Editor" icon-name="standard:account">
        
        <div class="slds-p-around_medium slds-grid slds-gutters slds-wrap slds-grid_vertical-align-center">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                <lightning-input 
                    type="search" 
                    label="Search Account Name" 
                    placeholder="Search name..."
                    value={searchKey} 
                    onchange={handleSearchChange}>
                </lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                <lightning-input 
                    type="search" 
                    label="Filter by Email" 
                    placeholder="Search email..."
                    value={emailSearchKey} 
                    onchange={handleEmailSearchChange}>
                </lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                <lightning-combobox 
                    name="typeFilter" 
                    label="Filter Type" 
                    value={chosenType} 
                    options={typeOptions} 
                    onchange={handleTypeFilterChange}>
                </lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-top_large">
                <lightning-button 
                    label="Clear Filters" 
                    variant="neutral" 
                    onclick={handleClearFilters}>
                </lightning-button>
            </div>
        </div>

        <template if:true={showSaveButton}>
            <div class="slds-m-left_medium slds-m-bottom_medium">
                <lightning-button 
                    label="Save Changes" 
                    variant="brand" 
                    icon-name="utility:save"
                    onclick={handleSave}>
                </lightning-button>
            </div>
        </template>

        <div class="slds-p-around_medium slds-scrollable_x">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-no-row-hover">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col" style="width: 25%;"><div class="slds-truncate">Account Name</div></th>
                        <th scope="col" style="width: 20%;"><div class="slds-truncate">Email</div></th>
                        <th scope="col" style="width: 15%;"><div class="slds-truncate">Phone</div></th>
                        <th scope="col" style="width: 20%;"><div class="slds-truncate">Type</div></th>
                        <th scope="col" style="width: 20%;"><div class="slds-truncate">Annual Revenue</div></th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={filteredAccounts} for:item="acc">
                        <tr key={acc.Id} class="slds-hint-parent">
                            <td>
                                <div class="slds-truncate" title={acc.Name}>
                                    <strong>{acc.Name}</strong>
                                </div>
                            </td>
                            <td>
                                <div class="slds-truncate" title={acc.Email__c}>{acc.Email__c}</div>
                            </td>
                            <td>
                                <div class="slds-truncate" title={acc.Phone}>{acc.Phone}</div>
                            </td>
                            <td>
                                <lightning-combobox
                                    name="inlineTypeDropdown"
                                    data-id={acc.Id}
                                    value={acc.Type}
                                    options={inlineTypeOptions}
                                    variant="label-hidden"
                                    placeholder="Select an Option"
                                    onchange={handleInlineTypeChange}
                                    dropdown-alignment="auto">
                                </lightning-combobox>
                            </td>
                            <td>
                                <div class="slds-truncate">
                                    <lightning-formatted-number 
                                        value={acc.AnnualRevenue} 
                                        format-style="currency">
                                    </lightning-formatted-number>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>

            <template if:false={filteredAccounts.length}>
                <div class="slds-align_absolute-center slds-p-around_xl">
                    <p class="slds-text-color_weak slds-text-heading_small">No matching account records found.</p>
                </div>
            </template>
        </div>
        
    </lightning-card>
</template>
